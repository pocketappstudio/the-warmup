name: iOS

on:
  push:
    branches: [ios-app, ios-widget, main]
    paths: ['ios/**', 'js/**', 'css/**', 'index.html', 'audio/**', 'capacitor.config.json', 'package*.json', 'scripts/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'capacitor.config.json', 'package*.json', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Archive and upload to TestFlight (needs the App Store Connect secrets)'
        type: boolean
        default: false

jobs:
  simulator-screenshots:
    name: Simulator screenshots (demo data)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:www
        env:
          DEMO: "1"
          APP_BUILD: "sim"
      - run: npx cap sync ios
      - name: Build for simulator
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 5
      - name: Boot, launch, screenshot
        run: |
          xcrun simctl list devices available | grep -E "iPhone" | head -20
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];c=[x for r in d.values() for x in r if 'iPhone' in x['name'] and 'Pro' in x['name'] and 'Max' not in x['name']];print(c[-1]['udid'])")
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryLevel 100 --cellularBars 4 || true
          APP=$(find build/Build/Products -name App.app -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.pocketappstudio.thewarmup
          mkdir -p shots; sleep 9
          xcrun simctl io "$UDID" screenshot shots/sim-1-today.png
          sleep 9
          xcrun simctl io "$UDID" screenshot shots/sim-2-current-need-form.png
          sleep 12
          xcrun simctl io "$UDID" screenshot shots/sim-3-current-need-saved.png
          ls -l shots
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: shots/

  simulator-build:
    name: Build for simulator (no signing)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:www
      - run: npx cap sync ios
      - name: Build
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40

  testflight:
    name: Archive and upload to TestFlight
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-15
    env:
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Select Xcode 26 (App Store requires the iOS 26 SDK)
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "No Xcode 26 on this runner"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Check secrets
        run: |
          for v in KEY_ID ISSUER_ID KEY_P8 TEAM_ID; do
            if [ -z "${!v}" ]; then echo "Missing secret for $v"; exit 1; fi
          done
      - run: npm ci
      - run: npm run build:www
        env:
          APP_BUILD: "1.0 (${{ github.run_number }})"
      - run: npx cap sync ios
      - name: Write API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
      - name: Archive
        run: |
          xcodebuild archive -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"
      - name: Verify the fixes are inside the archived web bundle
        run: |
          W="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app/public"
          grep -q 'window.BUILD="1.0 (${{ github.run_number }})"' "$W/index.html"
          grep -q 'viewport-fit=cover' "$W/index.html"
          grep -q 'isNativePlatform()))' "$W/index.html"
          grep -q 'safe-area-inset-top' "$W/css/style.css"
          grep -q 'aria-disabled' "$W/js/app.js"
          grep -q "'general'" "$W/js/app.js"
          grep -q '"contentInset": "never"' "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app/capacitor.config.json"
          ! grep -q "I got fired" "$W/index.html"
          echo "bundle OK"
      - name: Embed entitlements in archive
        run: |
          A="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          codesign -f -s - --entitlements ios/App/WarmUpWidget/WarmUpWidget.entitlements "$A/PlugIns/WarmUpWidget.appex"
          codesign -f -s - --entitlements ios/App/App/App.entitlements "$A"
          codesign -d --entitlements - "$A" 2>&1 | grep -a "group" || true
      - name: Export
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
      - name: Verify app group on both targets
        run: |
          cd "$RUNNER_TEMP/export" && rm -rf x && mkdir x && unzip -q App.ipa -d x
          for t in x/Payload/App.app x/Payload/App.app/PlugIns/WarmUpWidget.appex; do
            echo "== $t"; codesign -d --entitlements - "$t" 2>&1 | tr -d '\000' | cut -c1-400; codesign -d --entitlements - "$t" 2>&1 | grep -aq "application-groups" || echo "app group entitlement missing in $t"; security cms -D -i "$t/embedded.mobileprovision" 2>/dev/null | grep -a -A3 "application-groups" || true
          done
          ls x/Payload/App.app/PlugIns || true
      - name: Upload to App Store Connect
        run: |
          mkdir -p ~/.private_keys && cp "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" ~/.private_keys/
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/App.ipa" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          rm -rf ~/.private_keys
      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
