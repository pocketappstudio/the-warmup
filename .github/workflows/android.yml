name: Android
on:
  push:
    branches: [android-app]
  workflow_dispatch:
jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build web assets and sync
        run: |
          npm ci
          npm run build:www
          npx cap sync android
      - name: Debug build (unsigned smoke)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Decode upload keystore
        id: ks
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "present=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "present=true" >> "$GITHUB_OUTPUT"
      - name: Signed release bundle
        if: steps.ks.outputs.present == 'true'
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon bundleRelease
      - name: Verify signature
        if: steps.ks.outputs.present == 'true'
        run: |
          keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | grep -E "Owner|SHA256" | head -3
      - name: Upload AAB artifact
        if: steps.ks.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: thewarmup-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: thewarmup-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
